[package]
name = "rubyn-harness"
version = "0.1.15"
description = "A focused native harness for Ruby and Rails teams"
authors = ["Rubyn Harness contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "rubyn_harness_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "rubyn-harness"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
